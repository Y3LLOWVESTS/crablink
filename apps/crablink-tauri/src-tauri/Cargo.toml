[package]
license = "MIT OR Apache-2.0"
name = "crablink-tauri"
version = "0.1.0"
description = "CrabLink Tauri native client"
authors = ["RustyOnions contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "crablink_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs"] }
tokio-util = { version = "0.7", features = ["io"] }
urlencoding = "2"
blake3 = "1"
getrandom = "0.3"
crablink-native-core = { path = "../../../crates/crablink-native-core" }
svc-passport = { path = "../../../../RustyOnions/crates/svc-passport", default-features = false, features = ["native-passport"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.1.0", default-features = false, features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography"] }

[dev-dependencies]
secret-service = { version = "=5.1.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
